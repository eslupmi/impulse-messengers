name: _tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: blacksmith-4vcpu-ubuntu-2204
      python-versions:
        type: string
        default: '["3.12"]'

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout messenger libraries
        uses: actions/checkout@v5
        with:
          path: impulse-messengers

      - name: Checkout IMPulse
        uses: actions/checkout@v5
        with:
          repository: eslupmi/impulse
          ref: messenger-split
          path: impulse
      
      - name: Create config from none example
        run: |
          cp impulse/examples/impulse.none.yml impulse/impulse.yml

      - name: Run tests
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:Z" \
            -e DATA_PATH=/data \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -w /workspace/impulse \
            --entrypoint sh \
            ghcr.io/astral-sh/uv:python${{ matrix.python-version }}-bookworm-slim \
            -c "
              uv venv /tmp/venv && \
              uv pip install --python /tmp/venv -r requirements.txt -r tests.requirements.txt && \
              uv pip install --python /tmp/venv --no-deps /workspace/impulse-messengers/packages/* && \
              /tmp/venv/bin/python -m pytest tests/ --color=yes -v
            "
