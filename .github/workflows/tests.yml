name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review

permissions:
  contents: read

jobs:
  tests:
    if: github.event.pull_request.draft == false
    uses: eslupmi/ci-templates/.github/workflows/_unit_tests.yml@develop
