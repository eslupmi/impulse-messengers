name: Verify messenger libraries

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Compatible eslupmi/impulse branch, tag or commit
        type: string
        default: messenger-split

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: impulse-messengers
    steps:
      - name: Checkout messenger libraries
        uses: actions/checkout@v5
        with:
          path: impulse-messengers
          persist-credentials: false
      - name: Checkout compatible IMPulse
        uses: actions/checkout@v5
        with:
          repository: eslupmi/impulse
          ref: ${{ inputs.core_ref || 'messenger-split' }}
          path: impulse
          persist-credentials: false
      - name: Check compatible IMPulse packaging
        run: |
          if ! test -f ../impulse/pyproject.toml || ! test -f ../impulse/impulse_messenger_api/__init__.py; then
            echo "::error::The selected IMPulse ref must include impulse-bot packaging and impulse_messenger_api. Push coordinated extraction changes or choose a compatible core_ref."
            exit 1
          fi
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.22"
          python-version: "3.10"
      - name: Synchronize integration workspace
        run: uv sync --all-packages --locked
      - name: Lint libraries and verification harness
        run: uv run --no-sync ruff check packages scripts tests --target-version py310
      - name: Test verification harness
        run: uv run --no-sync python -m unittest discover -s tests
      - name: Run IMPulse integration tests
        run: |
          cp ../impulse/examples/impulse.none.yml ../impulse/impulse.yml
          CONFIG_PATH="$PWD/../impulse" DATA_PATH=/tmp/impulse-test-data \
            uv run --project "$PWD" --directory ../impulse --no-sync python -m pytest tests/ --color=yes -v
      - name: Verify installed packages
        run: uv run --no-sync python scripts/verify-packages.py --core ../impulse
