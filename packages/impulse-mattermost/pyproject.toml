[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-mattermost"
version = "3.8.0"
description = "Mattermost messenger provider for IMPulse"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["pydantic~=2.11.7", "aiohttp~=3.13.3"]

[project.entry-points."impulse.messengers"]
mattermost = "impulse_mattermost.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impulse_mattermost = ["resources/*.j2", "py.typed"]
