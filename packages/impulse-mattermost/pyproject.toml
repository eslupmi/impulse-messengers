[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-mattermost"
version = "0.1.0"
description = "Mattermost messenger provider for IMPulse"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["impulse-bot>=3.7.1,<4.0", "pydantic~=2.11.7", "aiohttp~=3.13.3"]

[project.entry-points."impulse.messengers"]
mattermost = "impulse_mattermost.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impulse_mattermost = ["resources/*.j2", "py.typed"]
