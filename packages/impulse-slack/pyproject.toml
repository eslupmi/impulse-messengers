[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-slack"
version = "3.8.0"
description = "Slack messenger provider for IMPulse"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
dependencies = ["pydantic~=2.11.7"]

[project.entry-points."impulse.messengers"]
slack = "impulse_slack.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impulse_slack = ["resources/*.j2", "py.typed"]
