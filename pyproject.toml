[project]
name = "impulse-messengers-workspace"
version = "3.8.0"
description = "Development workspace for the IMPulse messenger libraries"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
test = [
    "pytest~=8.3.2",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=5.0.0",
    "pytest-mock~=3.14.0",
    "pytest-xdist~=3.6.0",
    "pytest-aiohttp~=1.0.5",
]
lint = ["ruff==0.16.10"]
dev = [{include-group = "test"}, {include-group = "lint"}]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
impulse-bot = { path = "../impulse", editable = true }

[tool.ruff.lint]
# Preserve the existing correctness gate across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]
